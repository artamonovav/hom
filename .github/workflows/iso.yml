name: Build Freed ISOs

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout Freed data branch
        run: |
          for attempt in 1 2 3; do
            rm -rf freed-data
            if git clone --depth 1 --branch Freed \
              "https://github.com/${GITHUB_REPOSITORY}.git" freed-data; then
              break
            fi
            echo "Freed clone failed (attempt ${attempt}), retrying..."
            sleep 5
          done
          test -d freed-data/data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y genisoimage
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build site from Freed data
        run: |
          for year in 2017 2020 2023 2025 2026; do
            python -m webom build --car freed --year "$year" \
              --data freed-data/data --site site
          done

      - name: Verify site
        run: |
          python -m webom verify --car freed \
            --data freed-data/data --site site

      - name: Build split ISOs
        run: |
          python tools/make_iso.py --site site --output-dir dist

      - name: Upload ISO artifacts
        uses: actions/upload-artifact@v4
        with:
          name: honda-freed-isos
          path: dist/*.iso
          if-no-files-found: error

      - name: Attach ISOs to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.iso
