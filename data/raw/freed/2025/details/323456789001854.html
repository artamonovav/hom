  <div class="cbox togglebox" id="d__8255">

            </div>
            <div class="callout callout_1column" id="d__8259">
              <ul class="table_set callout" id="d__1434">
                <li id="d__1435" class="clearfix">
                  <span id="d__8260">
                    <img class="img_num" src="../img/1.png" ya_callout="1" style="" id="d__8261" />
                  </span>
                  <p class="" id="d_323_456_789_001855">ノブ</p>
                </li>
              </ul>
            </div>
          </div>
          <div class="right-wrap" id="d__1437">
            <p id="d_323_456_789_001856">
              <strong id="d__1438">ヘッドレストの調節</strong>
            </p>
            <ol id="d__1439" class="defaultList space-line">
              <li id="d__1440" class="listitem">
                <span class="" id="d_323_456_789_001857">高くするときは、引き上げる</span>
              </li>
              <li id="d__1441" class="listitem">
                <span id="d_323_456_789_001858">低くするときは、ノブを押しながら下げる</span>
              </li>
              <li id="d__1442" class="listitem">
                <span id="d_323_456_789_001859">取り外すときは、ノブを押しながら引き上げる</span>
              </li>
              <li id="d__1443" class="listitem">
                <span id="d_323_456_789_001860">取り付けるときは、ヘッドレストの脚を元の位置に差し込む</span>
                <ol class="arrow arrows" id="d__1444">
                  <li id="d__1445" class="arrow listitem">
                    <span class="" id="d_323_456_789_001861">ヘッドレストを軽く上下させ、確実に固定する</span>
                  </li>
                </ol>
              </li>
            </ol>
          </div>
        </div>
      </div>
    </div>
