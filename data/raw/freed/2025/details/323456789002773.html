  <p id="d_323_456_789_002773" class="title">フロントガラス熱線スイッチ(霜取り)の使用方法</p>
  <div class="cbox togglebox" id="d__9188">
    <p id="d_323_456_789_002774">パワーモードがON モードのときに、フロントガラスの下端を暖め、雪の固着や凍結によるワイパーブレードラバーの損傷を防ぐことができます。</p>
    <div class="column02 clearfix" id="d__9189">
      <div class="callout callout_2column_v" id="d__9190">
        <div class="cbox_inner" id="d__2988">
          <div class="left-wrap" id="d__2989">
            <img src="../img/33F02013.png" id="d__2991" ya_callout="1" style="" />
          </div>
          <div class="right-wrap" id="d__2992">
            <p id="d_323_456_789_002775">スイッチを押すと、フロントガラス熱線がONになります。</p>
            <ol class="arrow arrows" id="d__2993">
              <li id="d__2994" class="arrow listitem">
                <span class="" id="d_323_456_789_002776">約15分経過後、自動的に停止します。</span>
              </li>
            </ol>
            <p id="d_323_456_789_002777"> </p>
          </div>
        </div>
      </div>
    </div>
    <div class="supplementary" id="d__2995">
      <p class="sup_title" id="d__9191">
        <img class="sup_title" src="../img/note.png" id="d__9192" />
      </p>
      <div class="sup_txt" id="d__9193">
        <div class="supplement" id="d__9194">
          <strong class="supplement_subhead" id="d_323_456_789_002778">消費電力が大きいため、霜が取れたらOFFにし、エンジンの回転数が低いときに長時間使用しないでください。12Vバッテリー容量が低下し、エンジン始動に影響することがあります。</strong>
        </div>
      </div>
    </div>
  </div>
  <p class="specnote" id="d__9195">✤：タイプやオプションなどにより、装備が異なります。</p>
