  <p id="d_323_456_789_002296" class="title">イージードアクローザー</p>
  <div class="cbox togglebox" id="d__8837">
    <p id="d_323_456_789_002297">スライドドアを半ドア状態の位置まで閉めると、自動的に閉まります。</p>
    <p id="d_323_456_789_002298">パワースライドドアのメインスイッチの位置に関係なくイージードアクローザーが作動します。</p>
    <ol id="d__2293" class="defaultList space-line">
      <li id="d__2294" class="listitem">
        <span class="" id="d_323_456_789_002299">イージードアクローザー作動中にスライドドアのハンドルを引くと、作動が止まり半ドア状態のままになります。また、スライドドアのハンドルを引いたままドアを閉めると、イージードアクローザーは作動しません。</span>
      </li>
    </ol>
    <div class="caution" id="d__2295">
      <p class="caution_title" id="d__8838">
        <img src="../img/caution-sign.png" alt="" width="100%" id="d__8839" />注意</p>
      <div class="caution_txt" id="d__8840">
        <p class="supplement_subhead" id="d_323_456_789_002300">
          <strong id="d__2296">半ドア状態の位置からドアが自動的に閉まるため、手などをはさまないように注意する。</strong>
        </p>
      </div>
    </div>
    <div class="supplementary" id="d__2297">
      <p class="sup_title" id="d__8841">
        <img class="sup_title" src="../img/note.png" id="d__8842" />
      </p>
      <div class="sup_txt" id="d__8843">
        <div class="supplement" id="d__8844">
          <strong class="supplement_subhead" id="d_323_456_789_002301">故障の原因になるので、イージードアクローザーが作動しているときは、無理な力をかけないでください。</strong>
        </div>
      </div>
    </div>
  </div>
