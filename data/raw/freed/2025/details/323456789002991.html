  <p id="d_323_456_789_002991" class="title">スライドドアウィンドウサンシェード</p>
  <div class="cbox togglebox" id="d__9476">
    <div class="column02 clearfix" id="d__9477">
      <div class="callout callout_2column_v" id="d__9478">
        <div class="cbox_inner" id="d__3397">
          <div class="left-wrap" id="d__3398">
            <div id="d__9479">
              <img src="../img/33F03015.png" id="d__3400" ya_callout="1" style="" />
            </div>
            <div class="callout callout_1column" id="d__9480">
              <ul class="table_set callout" id="d__3401">
                <li id="d__3402" class="clearfix">
                  <span id="d__9481">
                    <img class="img_num" src="../img/1.png" ya_callout="1" style="" id="d__9482" />
                  </span>
                  <p class="" id="d_323_456_789_002992">ノブ</p>
                </li>
                <li id="d__3404" class="clearfix">
                  <span id="d__9483">
                    <img class="img_num" src="../img/2.png" ya_callout="1" style="" id="d__9484" />
                  </span>
                  <p class="" id="d_323_456_789_002993">フック</p>
                </li>
              </ul>
            </div>
          </div>
          <div class="right-wrap" id="d__3406">
            <p id="d_323_456_789_002994">使用するときはノブを持って引き上げます。</p>
            <p id="d_323_456_789_002995">サンシェードをフックにかけます。</p>
          </div>
        </div>
      </div>
    </div>
    <p id="d_323_456_789_002996">以下の場合、サンシェードが破損するおそれがあります。</p>
    <ol id="d__3407" class="defaultList space-line">
      <li id="d__3408" class="listitem">
        <span class="" id="d_323_456_789_002997">斜めに収納したり、勢いよく収納する</span>
      </li>
      <li id="d__3409" class="listitem">
        <span id="d_323_456_789_002998">フックにかけたままスクリーン部分をめくる</span>
      </li>
    </ol>
    <div class="caution" id="d__3410">
      <p class="caution_title" id="d__9485">
        <img src="../img/caution-sign.png" alt="" width="100%" id="d__9486" />注意</p>
      <div class="caution_txt" id="d__9487">
        <p class="supplement_subhead" id="d_323_456_789_002999">
          <strong id="d__3411">フックにはサンシェード以外のものをかけたりしない。</strong>
        </p>
        <p class="supplement_para" id="d_323_456_789_003000">サイドカーテンエアバッグが正常に作動しなかったり、作動時にものが飛んだりしてけがをするおそれがあります。また、走行中は窓を閉めてください。風にあおられてサンシェードがフックから外れるおそれがあります。</p>
      </div>
    </div>
