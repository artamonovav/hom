  <p id="d_323_456_789_004968" class="title">ウィンドウォッシャー液の補給方法</p>
  <div class="cbox togglebox" id="d__10460">
    <div class="column02 clearfix" id="d__10461">
      <div class="callout callout_2column_v" id="d__10462">
        <div class="cbox_inner" id="d__6026">
          <div class="left-wrap" id="d__6027">
            <img src="../img/33F06005.png" id="d__6029" ya_callout="1" style="" />
          </div>
          <div class="right-wrap" id="d__6030">
            <p id="d_323_456_789_004969">ウォッシャー液が減っていた場合は、ウォッシャー液を補給してください。</p>
            <p id="d_323_456_789_004970">ウォッシャー液の量は、ウォッシャー液レベルゲージで確認します。</p>
          </div>
        </div>
      </div>
    </div>
    <ol id="d__6031" class="defaultList space-line">
      <li id="d__6032" class="listitem">
        <span class="" id="d_323_456_789_004971">ウォッシャー液以外の液体を、タンクに入れないでください。</span>
      </li>
      <li id="d__6033" class="listitem">
        <span id="d_323_456_789_004972">ウォッシャー液は必要に応じて水（軟水）で薄めてください。</span>
      </li>
      <li id="d__6034" class="listitem">
        <span id="d_323_456_789_004973">冬期はウォッシャー液の凍結を防ぐため、ウォッシャー液の濃度を上げてください。</span>
      </li>
    </ol>
  </div>
