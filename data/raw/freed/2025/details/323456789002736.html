  <p id="d_323_456_789_002736" class="title">リヤワイパー・ウォッシャーの操作方法</p>
  <div class="cbox togglebox" id="d__9142">
    <div class="column02 clearfix" id="d__9143">
      <div class="callout callout_2column_v" id="d__9144">
        <div class="cbox_inner" id="d__2911">
          <div class="left-wrap" id="d__2912">
            <img src="../img/33F02009.png" id="d__2914" ya_callout="1" style="" />
          </div>
          <div class="right-wrap" id="d__2915">
            <div class="callout callout_1column" id="d__9145">
              <ul class="table_set callout" id="d__2916">
                <li id="d__2917" class="clearfix">
                  <span id="d__9146">
                    <img class="img_num" src="../img/1.png" id="d__9147" />
                  </span>
                  <p class="" id="d_323_456_789_002737">
                    <strong id="d__2919">リヤワイパースイッチOFF（停止）</strong>
                  </p>
                </li>
                <li id="d__2920" class="clearfix">
                  <span id="d__9148">
                    <img class="img_num" src="../img/2.png" id="d__9149" />
                  </span>
                  <p class="" id="d_323_456_789_002738">
                    <strong id="d__2922">リヤワイパースイッチINT（間欠作動）</strong>
                  </p>
                </li>
                <li id="d__2923" class="clearfix">
                  <span id="d__9150">
                    <img class="img_num" src="../img/3.png" id="d__9151" />
                  </span>
                  <p class="" id="d_323_456_789_002739">
                    <strong id="d__2925">リヤワイパースイッチON（低速作動）</strong>
                  </p>
                </li>
                <li id="d__2926" class="clearfix">
                  <span id="d__9152">
                    <img class="img_num" src="../img/4.png" id="d__9153" />
                  </span>
                  <p class="" id="d_323_456_789_002740">
                    <strong id="d__2928">ウォッシャースイッチ</strong>
                  </p>
                </li>
              </ul>
            </div>
            <p id="d_323_456_789_002741">スイッチを<img src="../img/it_047.png" id="d__2929" class=" icon_inline" style="height: 24px; vertical-align: middle;" />まで回すと、ウォッシャー液が噴射します。スイッチを回している間はワイパーが作動し、スイッチを放すと数回ワイパーが作動して止まります。</p>
