  <p id="d_323_456_789_003604" class="title">作動条件</p>
  <div class="cbox togglebox" id="d__9793">
    <p id="d_323_456_789_003605">              以下の条件を満たすとき作動します。
            </p>
    <ol id="d__4198" class="defaultList space-line">
      <li id="d__4199" class="listitem">
        <span class="" id="d_323_456_789_003606">白線（黄線）が連続しているとき</span>
      </li>
      <li id="d__4200" class="listitem">
        <span id="d_323_456_789_003607">車速が約10～40km/hで走行しているとき</span>
      </li>
      <li id="d__4201" class="listitem">
        <span id="d_323_456_789_003608">直線の道路を走行しているとき</span>
      </li>
      <li id="d__4202" class="listitem">
        <span id="d_323_456_789_003609">方向指示器（ウィンカー）を使用していないとき</span>
      </li>
      <li id="d__4203" class="listitem">
        <span id="d_323_456_789_003610">システムがアクセル、ブレーキ、ハンドルの操作の量と頻度から運転意志がないと判断したとき</span>
      </li>
    </ol>
    <p id="d_323_456_789_003611"> </p>
    <p id="d_323_456_789_003612">エンジンを始動後、約15秒の間は歩行者事故低減ステアリングは作動しません。</p>
  </div>
