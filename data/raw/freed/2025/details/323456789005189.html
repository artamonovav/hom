  <p id="d_323_456_789_005189" class="title">LED車外灯について</p>
  <div class="cbox togglebox" id="d__10713">
    <p id="d_323_456_789_005190">下記のライトはLEDを使用しています。点検、交換はHonda 販売店に依頼してください。</p>
    <ol id="d__6456" class="defaultList space-line">
      <li id="d__6457" class="listitem">
        <span class="" id="d_323_456_789_005191">ヘッドライト</span>
      </li>
      <li id="d__6458" class="listitem">
        <span id="d_323_456_789_005192">前面方向指示器/ 前面非常点滅表示灯</span>
      </li>
      <li id="d__6459" class="listitem">
        <span id="d_323_456_789_005193">デイタイムランニングライト/ 車幅灯</span>
      </li>
      <li id="d__6460" class="listitem">
        <span id="d_323_456_789_005194">フォグライト<span class="OptionSymbol" id="d__6461">✤</span></span>
      </li>
      <li id="d__6462" class="listitem">
        <span id="d_323_456_789_005195">側面方向指示器/側面非常点滅表示灯</span>
      </li>
      <li id="d__6463" class="listitem">
        <span id="d_323_456_789_005196">制動灯</span>
      </li>
      <li id="d__6464" class="listitem">
        <span id="d_323_456_789_005197">尾灯</span>
      </li>
      <li id="d__6465" class="listitem">
        <span id="d_323_456_789_005198">番号灯</span>
      </li>
      <li id="d__6466" class="listitem">
        <span id="d_323_456_789_005199">ハイマウントストップランプ</span>
      </li>
      <li id="d__6467" class="listitem">
        <span id="d_323_456_789_005200">後面方向指示器/ 後面非常点滅表示灯</span>
      </li>
      <li id="d__6468" class="listitem">
        <span id="d_323_456_789_005201">後退灯</span>
      </li>
    </ol>
  </div>
  <p class="specnote" id="d__10714">✤：タイプやオプションなどにより、装備が異なります。</p>
