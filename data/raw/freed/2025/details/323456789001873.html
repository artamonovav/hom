  <p id="d_323_456_789_001873" class="title">セカンドキャプテンシート<span class="OptionSymbol" id="d__1484">✤</span>の調整方法</p>
  <div class="cbox togglebox" id="d__8284">
    <div class="column02 clearfix" id="d__8285">
      <div class="callout callout_2column_v" id="d__8286">
        <div class="cbox_inner" id="d__1485">
          <div class="left-wrap" id="d__1486">
            <div id="d__8287">
              <img src="../img/33F01048.png" id="d__1488" ya_callout="1" style="" />
            </div>
            <div class="callout callout_1column" id="d__8288">
              <ul class="table_set callout" id="d__1489">
                <li id="d__1490" class="clearfix">
                  <span id="d__8289">
                    <img class="img_num" src="../img/1.png" ya_callout="1" style="" id="d__8290" />
                  </span>
                  <p class="" id="d_323_456_789_001874">ノブ</p>
                </li>
              </ul>
            </div>
          </div>
          <div class="right-wrap" id="d__1492">
            <p id="d_323_456_789_001875">
              <strong id="d__1493">ヘッドレストの調節</strong>
            </p>
            <ol id="d__1494" class="defaultList space-line">
              <li id="d__1495" class="listitem">
                <span class="" id="d_323_456_789_001876">高くするときは、引き上げる</span>
              </li>
              <li id="d__1496" class="listitem">
                <span id="d_323_456_789_001877">低くするときは、ノブを押しながら下げる</span>
              </li>
              <li id="d__1497" class="listitem">
                <span id="d_323_456_789_001878">取り外すときは、ノブを押しながら引き上げる</span>
              </li>
              <li id="d__1498" class="listitem">
                <span id="d_323_456_789_001879">取り付けるときは、ヘッドレストの脚を元の位置に差し込む</span>
                <ol class="arrow arrows" id="d__1499">
                  <li id="d__1500" class="arrow listitem">
                    <span class="" id="d_323_456_789_001880">ヘッドレストを軽く上下させ、確実に固定する</span>
                  </li>
                </ol>
              </li>
            </ol>
          </div>
        </div>
      </div>
    </div>
    <div class="column02 clearfix" id="d__8291">
      <div class="callout callout_2column_v" id="d__8292">
        <div class="cbox_inner" id="d__1501">
          <div class="left-wrap" id="d__1502">

            </div>
            <div class="callout callout_1column" id="d__8294">
              <ul class="table_set callout" id="d__1505">
                <li id="d__1506" class="clearfix">
                  <span id="d__8295">
                    <img class="img_num" src="../img/1.png" ya_callout="1" style="" id="d__8296" />
                  </span>
                  <p class="" id="d_323_456_789_001881">レバー</p>
                </li>
              </ul>
            </div>
          </div>
          <div class="right-wrap" id="d__1508">
            <p id="d_323_456_789_001882">
              <strong id="d__1509">背もたれの角度調節</strong>
            </p>
            <p id="d_323_456_789_001883">レバーを引き上げる</p>
          </div>
        </div>
      </div>
    </div>
    <div class="column02 clearfix" id="d__8297">
      <div class="callout callout_2column_v" id="d__8298">

                  <p class="" id="d_323_456_789_001884">レバー</p>
                </li>
              </ul>
            </div>
          </div>
          <div class="right-wrap" id="d__1517">
            <p id="d_323_456_789_001885">

            </p>
            <p id="d_323_456_789_001886">レバーを引き上げる</p>
          </div>
        </div>
      </div>
    </div>
