  <p id="d_323_456_789_002403" class="title no_accordion">指定燃料とタンク容量</p>
  <p id="d_323_456_789_002404" class="sub-title">指定燃料</p>
  <div class="cbox togglebox" id="d__8916">
    <p id="d_323_456_789_002405">無鉛レギュラーガソリン</p>
    <p id="d_323_456_789_002406">レギュラーバイオ混合ガソリン（E10/ETBE22）</p>
    <div class="supplementary" id="d__2459">
      <p class="sup_title" id="d__8917">
        <img class="sup_title" src="../img/note.png" id="d__8918" />
      </p>
      <div class="sup_txt" id="d__8919">
        <div class="supplement" id="d__8920">
          <strong class="supplement_subhead" id="d_323_456_789_002407">指定燃料以外の燃料（粗悪ガソリン、軽油、灯油等）を補給したり、不適切な燃料添加剤を使用しないでください。触媒装置、エンジンや燃料系などの損傷や悪影響を与えるおそれがあります。</strong>
        </div>
        <div class="supplement_para" id="d_323_456_789_002408">プレミアムガソリンも使用できますが、本来のエンジン性能が大きく変わることはありません。</div>
      </div>
    </div>
  </div>
  <p id="d_323_456_789_002409" class="sub-title">タンク容量</p>
  <div class="cbox togglebox" id="d__8921">
    <div class="typehead" id="d__8922">
      <b class="info_strong" id="d__8923">
        <span class="grade-text" id="d__2462">2WD 車</span>
      </b>
    </div>
    <p id="d_323_456_789_002410">42 リットル</p>
    <div class="typehead" id="d__8924">
      <b class="info_strong" id="d__8925">
        <span class="grade-text" id="d__2463">AWD 車</span>
      </b>
    </div>
    <p id="d_323_456_789_002411">53 リットル</p>
  </div>
