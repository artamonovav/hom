  <p id="d_323_456_789_005051" class="title">タイヤとホイールの交換について</p>
  <div class="cbox togglebox" id="d__10558">
    <p id="d_323_456_789_005052">タイヤは、四輪とも指定サイズ、同一種類、同一銘柄および摩耗差のないタイヤをお使いください。</p>
    <p id="d_323_456_789_005053">同時にすべての4つのタイヤを交換することをお勧めします。それができない場合は、前輪または後輪タイヤの左右を一緒に交換してください。</p>
    <p id="d_323_456_789_005054">ホイールの仕様が純正ホイールと同一のものか確認してください。</p>
    <div class="warning" id="d__6233">
      <p class="warning_title" id="d__10559">
        <img src="../img/warning-sign.png" alt="" width="100%" id="d__10560" />警告</p>
      <div class="warning_txt" id="d__10561">
        <p id="d_323_456_789_005055">
          <strong id="d__6234">必ず、サイズと種類が適切なタイヤを使用する。</strong>
        </p>
        <p id="d_323_456_789_005056">不適切なタイヤを使用すると、重大な傷害や死亡に至る事故につながるおそれがあります。</p>
      </div>
    </div>
  </div>
