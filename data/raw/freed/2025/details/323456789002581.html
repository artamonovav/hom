  <p id="d_323_456_789_002581" class="title">ウィンカー（方向指示器）の操作方法  </p>
  <div class="cbox togglebox" id="d__9061">
    <p id="d_323_456_789_002582">ウィンカースイッチを上下に操作する。メーター内の<img src="../img/it_014.png" id="d__2720" class=" icon_inline" style="height: 24px; vertical-align: middle;" />方向指示器表示灯が点滅します。</p>
    <div class="column02 clearfix" id="d__9062">
      <div class="callout callout_2column_v" id="d__9063">
        <div class="cbox_inner" id="d__2721">
          <div class="left-wrap" id="d__2722">
            <img src="../img/33F02032.png" id="d__2724" ya_callout="1" style="" />
          </div>
          <div class="right-wrap" id="d__2725">
            <ol id="d__2726" class="defaultList space-line">
              <li id="d__2727" class="listitem">
                <span class="" id="d_323_456_789_002583">ワンタッチターンシグナル：レバーを軽く押し下げ/押し上げて放すと、方向指示器が3回点滅します。</span>
              </li>
              <li id="d__2728" class="listitem">
                <span id="d_323_456_789_002584">点滅中にレバーを反対方向に軽く押して放すと点滅が停止します。</span>
              </li>
            </ol>
          </div>
        </div>
      </div>
    </div>
    <div class="supplementary" id="d__9064">
      <div class="sup_title" id="d__9065">
        <img src="../img/gear.png" class="sup_title" id="d__9066" />
      </div>
      <div class="sup_txt" id="d__9067">
        <p class="refer gear" id="d_323_456_789_002585">ワンタッチターンシグナルのON/OFF設定を変更することができます。<p class="refer" id="d__9068"><a href="323456789004686.html#d_323_456_789_004792" id="d_323_456_789_002586" class="light">時計<span class="OptionSymbol" id="d__2729">✤</span>/車両設定</a></p></p>
      </div>
    </div>
  </div>
  <p class="specnote" id="d__9069">✤：タイプやオプションなどにより、装備が異なります。</p>
