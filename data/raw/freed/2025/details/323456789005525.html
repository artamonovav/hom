  <p id="d_323_456_789_005525" class="title">緊急時のエンジンの停止方法</p>
  <div class="cbox togglebox" id="d__10930">
    <p confirmed="1" id="d_323_456_789_005526">            走行中、緊急事態の場合にエンジンを停止することができます。エンジンを停止しなければならない場合は、以下のいずれかを行ってください。
          </p>
    <ol id="d__6967" class="defaultList space-line">
      <li id="d__6968" class="listitem">
        <span class="" id="d_323_456_789_005527">
          <span class="frame" id="d__6969">ENGINE START/STOP</span>を約2秒以上押す</span>
      </li>
      <li id="d__6970" class="listitem">
        <span id="d_323_456_789_005528">
          <span class="frame" id="d__6971">ENGINE START/STOP</span>を連続して3回押す</span>
      </li>
      <li id="d__6972" class="listitem">
        <span id="d_323_456_789_005529">この操作を行った場合は、ハンドルはロックせず、パワーモードはアクセサリーモードになります。</span>
      </li>
    </ol>
    <div class="supplementary" id="d__6973">
      <p class="sup_title" id="d__10931">
        <img class="sup_title" src="../img/note.png" id="d__10932" />
      </p>
      <div class="sup_txt" id="d__10933">
        <div class="supplement" id="d__10934">
          <strong class="supplement_subhead" id="d_323_456_789_005530">緊急時など必要な場合以外は、走行中にエンジンを停止しないでください。</strong>
        </div>
      </div>
    </div>
  </div>
