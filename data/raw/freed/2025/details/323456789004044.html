  <p id="d_323_456_789_004044" class="title">作動条件</p>
  <div class="cbox togglebox" id="d__9992">
    <ol id="d__4878" class="defaultList space-line">
      <li id="d__4879" class="listitem">
        <span class="" id="d_323_456_789_004045">ブレーキペダルを踏んでいるとき</span>
      </li>
      <li id="d__4880" class="listitem">
        <span id="d_323_456_789_004046">オートマチックブレーキホールドのブレーキ保持機能が作動しているとき</span>
      </li>
      <li id="d__4881" class="listitem">
        <span id="d_323_456_789_004047">渋滞追従機能付アダプティブクルーズコントロール（ACC）が作動中で停車しているとき</span>
      </li>
      <li id="d__4882" class="listitem">
        <span id="d_323_456_789_004048">
          <span class="frame" id="d__4883">N</span>でパーキングブレーキをかけているとき</span>
      </li>
    </ol>
    <p id="d_323_456_789_004049"> </p>
    <p id="d_323_456_789_004050">先行車との車間距離が約10m以上離れているとき、また渋滞追従機能付アダプティブクルーズコントロール（ACC）警告灯が点灯しているときは作動しません。</p>
