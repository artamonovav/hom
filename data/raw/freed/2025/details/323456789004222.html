  <p id="d_323_456_789_004222" class="title">パーキングセンサーのON/OFF</p>
  <div class="cbox togglebox" id="d__10068">
    <p id="d_323_456_789_004223">メーターでシステムのON/OFFを切り換えることができます。</p>
    <ol id="d__5108" class="defaultList space-line">
      <li id="d__5109" class="listitem">
        <span class="" id="d_323_456_789_004224">エンジン始動時は、パワーモードをOFFする前の状態（ONまたはOFF）を保持します。</span>
        <p class="refer" id="d_323_456_789_004225">
          <a href="323456789004686.html#d_323_456_789_004687" id="d_323_456_789_004226" class="light">表示の切り換えかた</a>
        </p>
        <p class="refer" id="d_323_456_789_004227">
          <a href="323456789004686.html#d_323_456_789_004736" id="d_323_456_789_004228" class="light">安全支援情報</a>
        </p>
      </li>
    </ol>
    <p id="d_323_456_789_004229"> </p>
    <p id="d_323_456_789_004230">リアパーキングセンサーだけをOFFにすることもできます。リアパーキングセンサーをOFFにすると、後退中の踏み間違い衝突軽減システムは作動しません。</p>
    <p class="refer" id="d_323_456_789_004231">
      <a href="323456789004686.html#d_323_456_789_004792" id="d_323_456_789_004232" class="light">時計<span class="OptionSymbol" id="d__5110">✤</span>/車両設定</a>
    </p>
    <p class="refer" id="d_323_456_789_004233">
      <a href="323456789003377.html#d_323_456_789_003377" id="d_323_456_789_004234" class="light">踏み間違い衝突軽減システムについて</a>
    </p>
  </div>
  <p class="specnote" id="d__10069">✤：タイプやオプションなどにより、装備が異なります。</p>
