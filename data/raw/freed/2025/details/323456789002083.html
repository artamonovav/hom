  <p id="d_323_456_789_002083" class="title">シートベルトリマインダー</p>
  <div class="cbox togglebox" id="d__8613">
    <div class="column02 clearfix" id="d__8614">
      <div class="callout callout_2column_v" id="d__8615">
        <div class="cbox_inner" id="d__1944">
          <div class="left-wrap" id="d__1945">
            <div id="d__8616">
              <img src="../img/33F01002.png" id="d__1947" ya_callout="1" style="" />
            </div>
            <div class="callout callout_1column" id="d__8617">
              <ul class="table_set callout" id="d__1948">
                <li id="d__1949" class="clearfix">
                  <span id="d__8618">
                    <img class="img_num" src="../img/1.png" ya_callout="1" style="" id="d__8619" />
                  </span>
                  <p class="" id="d_323_456_789_002084">シートベルト着用</p>
                </li>
                <li id="d__1951" class="clearfix">
                  <span id="d__8620">
                    <img class="img_num" src="../img/2.png" ya_callout="1" style="" id="d__8621" />
                  </span>
                  <p class="" id="d_323_456_789_002085">シートベルト未着用</p>
                </li>
              </ul>
            </div>
          </div>
          <div class="right-wrap" id="d__1953">
            <p id="d_323_456_789_002086">シートベルトリマインダーは乗員のシートベルトの未着用をお知らせします。シートベルトを着用すると警告は消えます。</p>
          </div>
        </div>
      </div>
    </div>
    <p id="d_323_456_789_002087">シートベルトを着用せずに走行した場合、停車したときや一定時間経過したときは、ブザーが停止します。</p>
    <ol class="arrow arrows" id="d__1954">
      <li id="d__1955" class="arrow listitem">
        <span class="" id="d_323_456_789_002088">助手席に人がいないときでも、荷物を置くと反応することがあります。</span>
      </li>
      <li id="d__1956" class="arrow listitem">
        <span id="d_323_456_789_002089">助手席にお子さまや小柄な方を乗せたり、クッションを使用しているときは、反応しないことがあります。</span>
      </li>
    </ol>
  </div>
