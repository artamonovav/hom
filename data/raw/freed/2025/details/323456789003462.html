  <p id="d_323_456_789_003462" class="title">システムを作動させるには</p>
  <div class="cbox togglebox" id="d__9734">
    <div class="column02 clearfix" id="d__9735">
      <div class="callout callout_2column_v" id="d__9736">
        <div class="cbox_inner" id="d__4020">
          <div class="left-wrap" id="d__4021">
            <img src="../img/33F04006.png" id="d__4023" ya_callout="1" style="" />
          </div>
          <div class="right-wrap" id="d__4024">
            <p id="d_323_456_789_003463">急アクセル抑制機能が作動するように設定されたHondaスマートキーを携帯していることを確認し、内蔵キーを使わずに解錠する。</p>
            <ol class="arrow arrows" id="d__4025">
              <li id="d__4026" class="arrow listitem">
                <span class="" id="d_323_456_789_003464">エンジンを始動したとき、急アクセル抑制機能の起動メッセージ、急アクセル抑制機能表⽰灯の点灯を確認してください。</span>
              </li>
              <li id="d__4027" class="arrow listitem">
                <span id="d_323_456_789_003465">起動メッセージを消すには、<img src="../img/it_068.png" id="d__4028" class=" icon_inline" style="height: 24px; vertical-align: middle;" />スイッチ（<img class="img_num" src="../img/1.png" id="d__9737" />）を押してください。</span>
              </li>
            </ol>
          </div>
        </div>
      </div>
    </div>
    <div class="supplementary" id="d__4030">
      <p class="sup_title" id="d__9738">
        <img class="sup_title" src="../img/note.png" id="d__9739" />
      </p>
      <div class="sup_txt" id="d__9740">
        <div class="supplement" id="d__9741">
          <strong class="supplement_subhead" id="d_323_456_789_003466">Hondaスマートキーが電池切れの場合、急アクセル抑制機能が起動しない場合があります。</strong>
        </div>
      </div>
    </div>
  </div>
  <p class="specnote" id="d__9742">✤：タイプやオプションなどにより、装備が異なります。</p>
