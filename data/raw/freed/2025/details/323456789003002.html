  <p id="d_323_456_789_003002" class="title">フロアボード<span class="OptionSymbol" id="d__3413">✤</span></p>
  <div class="cbox togglebox" id="d__9488">
    <div class="column02 clearfix" id="d__9489">
      <div class="callout callout_2column_v" id="d__9490">
        <div class="cbox_inner" id="d__3414">
          <div class="left-wrap" id="d__3415">
            <div id="d__9491">
              <img src="../img/33F03016.png" id="d__3417" ya_callout="1" style="" />
            </div>
            <div class="callout callout_1column" id="d__9492">
              <ul class="table_set callout" id="d__3418">
                <li id="d__3419" class="clearfix">
                  <span id="d__9493">
                    <img class="img_num" src="../img/1.png" ya_callout="1" style="" id="d__9494" />
                  </span>
                  <p class="" id="d_323_456_789_003003">フロアボード</p>
                </li>
              </ul>
            </div>
          </div>
          <div class="right-wrap" id="d__3421">
            <p confirmed="1" id="d_323_456_789_003004">フロアボードを外してカーゴスペースを広くできます。</p>
            <p confirmed="1" id="d_323_456_789_003005">外したフロアボードを車内に置く場合は、カーゴスペースの床面に置いてください。</p>
            <p confirmed="1" id="d_323_456_789_003006">フロアボードは表面、裏面どちらでも使用できます。</p>
          </div>
        </div>
      </div>
    </div>
    <div class="caution" id="d__3422">
      <p class="caution_title" id="d__9495">
        <img src="../img/caution-sign.png" alt="" width="100%" id="d__9496" />注意</p>
      <div class="caution_txt" id="d__9497">
        <p class="supplement_subhead" id="d_323_456_789_003007">
          <strong id="d__3423">走行中は荷物の出し入れはしない。</strong>
        </p>
        <p class="supplement_para" id="d_323_456_789_003008">急ブレーキなどのときに思わぬ事故につながるおそれがあります。</p>
        <p class="supplement_subhead" id="d_323_456_789_003009">
          <strong id="d__3424">フロアボードの上、およびカーゴスペースには人を乗せて走行しない。</strong>
        </p>
        <p class="supplement_para" id="d_323_456_789_003010">ブレーキや加速、衝突のときなどにけがをするおそれがあります。</p>
        <p class="supplement_subhead" id="d_323_456_789_003011">
          <strong id="d__3425">操作するときは、手や足などをはさまないように十分注意する。</strong>
        </p>
      </div>
    </div>
  </div>
  <p class="specnote" id="d__9498">✤：タイプやオプションなどにより、装備が異なります。</p>
