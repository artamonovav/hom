  <p id="d_323_456_789_001962" class="title">サードシート<span class="OptionSymbol" id="d__1699">✤</span>の調整方法</p>
  <div class="cbox togglebox" id="d__8447">
    <div class="column02 clearfix" id="d__8448">
      <div class="callout callout_2column_v" id="d__8449">
        <div class="cbox_inner" id="d__1700">
          <div class="left-wrap" id="d__1701">
            <div id="d__8450">
              <img src="../img/33F01081.png" id="d__1703" ya_callout="1" style="" />
            </div>
            <div class="callout callout_1column" id="d__8451">
              <ul class="table_set callout" id="d__1704">
                <li id="d__1705" class="clearfix">
                  <span id="d__8452">
                    <img class="img_num" src="../img/1.png" ya_callout="1" style="" id="d__8453" />
                  </span>
                  <p class="" id="d_323_456_789_001963">ノブ</p>
                </li>
              </ul>
            </div>
          </div>
          <div class="right-wrap" id="d__1707">
            <p id="d_323_456_789_001964">
              <strong id="d__1708">ヘッドレストの調節</strong>
            </p>
            <ol id="d__1709" class="defaultList space-line">
              <li id="d__1710" class="listitem">
                <span class="" id="d_323_456_789_001965">高くするときは、引き上げる</span>
              </li>
              <li id="d__1711" class="listitem">
                <span id="d_323_456_789_001966">低くするときは、ノブを押しながら下げる</span>
              </li>
              <li id="d__1712" class="listitem">
                <span id="d_323_456_789_001967">取り外すときは、ノブを押しながら引き上げる</span>
              </li>
              <li id="d__1713" class="listitem">
                <span id="d_323_456_789_001968">取り付けるときは、ヘッドレストの脚を元の位置に差し込む</span>
                <ol class="arrow arrows" id="d__1714">
                  <li id="d__1715" class="arrow listitem">
                    <span class="" id="d_323_456_789_001969">ヘッドレストを軽く上下させ、確実に固定する</span>
                  </li>
                </ol>
              </li>
            </ol>
          </div>
        </div>
      </div>
    </div>
    <div class="column02 clearfix" id="d__8454">
      <div class="callout callout_2column_v" id="d__8455">
        <div class="cbox_inner" id="d__1716">
          <div class="left-wrap" id="d__1717">
            <div id="d__8456">
              <img src="../img/33F01082.png" id="d__1719" ya_callout="1" style="" />
            </div>
            <div class="callout callout_1column" id="d__8457">
              <ul class="table_set callout" id="d__1720">
                <li id="d__1721" class="clearfix">
                  <span id="d__8458">
                    <img class="img_num" src="../img/1.png" ya_callout="1" style="" id="d__8459" />
                  </span>
                  <p class="" id="d_323_456_789_001970">レバー</p>
                </li>
              </ul>
            </div>
          </div>
          <div class="right-wrap" id="d__1723">
            <p id="d_323_456_789_001971">
              <strong id="d__1724">背もたれの角度調節</strong>
            </p>
            <p id="d_323_456_789_001972">レバーを前に倒す</p>
          </div>
        </div>
      </div>
    </div>
    <p id="d_323_456_789_001973">サードシートのヘッドレストを下げた状態で走行しない。衝突したときに重大な傷害を受けるおそれがあります。</p>
  </div>
  <p class="specnote" id="d__8460">✤：タイプやオプションなどにより、装備が異なります。</p>
