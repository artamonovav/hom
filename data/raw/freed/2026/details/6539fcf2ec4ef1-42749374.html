  <p id="6539fcf2ec4ef1.42749374" class="title">データの取り扱いについて</p>
  <div class="cbox togglebox" id="d__8097">
    <p id="1376539fcf2f0a7d7.13672898">HondaおよびHondaが委託した第三者は、記録されたデータを、不具合解析のための技術的診断や、Hondaの車両の研究開発、品質向上のために、取得し利用することがあります。Hondaは、取得したデータを、以下の場合を除き、第三者に開示または提供することはありません。</p>
    <ol id="d__67" class="defaultList space-line">
      <li id="d__68" class="listitem"><span class="" id="9e7-b658cc7029112c3.90846861">お車の使用者の同意（リース車、レンタカーの場合は借主の同意）がある場合</span></li>
      <li id="d__69" class="listitem"><span id="9e7-d658cc702911925.82258227">警察、裁判所、政府機関等からの、法的強制力のある要請に基づく場合</span></li>
      <li id="d__70" class="listitem"><span id="9e7-f658cc702911ea1.10731022">統計的な処理を行う等、所有者や使用者、お車が特定できないように加工したデータを、研究機関等に提供する場合</span></li>
    </ol>
  </div>
