  <p id="6539fcf51129f5.17472786" class="title">フロントガラス熱線スイッチ(霜取り)の使用方法</p>
  <div class="cbox togglebox" id="d__9913">
    <p id="156539fcf513dee4.62922334">パワーモードがON モードのときに、フロントガラスの下端を暖め、雪の固着や凍結によるワイパーブレードラバーの損傷を防ぐことができます。</p>
    <div class="column02 clearfix" id="d__9914">
      <div class="callout callout_2column_v" id="d__9915">
        <div class="cbox_inner" id="d__3339">
          <div class="left-wrap" id="d__3340">
            <div class="callout callout_2column" id="d__9916"><img src="../img/33F02013.png" id="d__3342" ya_callout="1" style="" /></div>
          </div>
          <div class="right-wrap" id="d__3343">
            <p id="3655dcaddcb4f28.38916834">スイッチを押すと、フロントガラス熱線がONになります。</p>
            <ol class="arrow arrows" id="d__3344">
              <li id="d__3345" class="arrow listitem"><span class="" id="aa3-14658244d09957e7.74963488">約15分経過後、自動的に停止します。</span></li>
            </ol>
            <p id="22655dcb1b5515f5.77311373"> </p>
          </div>
        </div>
      </div>
    </div>
    <div class="supplementary" id="d__3346">
      <p class="sup_title" id="d__9917"><img class="sup_title" src="../img/note.png" id="d__9918" /></p>
      <div class="sup_txt" id="d__9919">
        <div class="supplement" id="d__9920"><strong class="supplement_subhead" id="246539fcf513df97.72282580">消費電力が大きいため、霜が取れたらOFFにし、エンジンの回転数が低いときに長時間使用しないでください。12Vバッテリー容量が低下し、エンジン始動に影響することがあります。</strong></div>
      </div>
    </div>
  </div>
  <p class="specnote" id="d__9921">✤：タイプやオプションなどにより、装備が異なります。</p>
