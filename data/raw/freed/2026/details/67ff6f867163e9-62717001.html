  <p id="67ff6f867163e9.62717001" class="title">後退出庫サポートについて</p>
  <div class="cbox togglebox" id="d__10836">
    <p id="10315-567ff6f86725338.45532559">駐車場などから後退するときに、リヤバンパーのレーダーにより車両後方の左右から接近する他の車両を検知し、運転者に知らせる機能です。</p>
    <div class="warning" id="d__5441">
      <p class="warning_title" id="d__10837"><img src="../img/warning-sign.png" alt="" width="100%" id="d__10838" />警告</p>
      <div class="warning_txt" id="d__10839">
        <p id="10315-967ff6f86725514.10863930"><strong id="d__5442">このシステムは出庫時の後方確認などをサポートするためのものであり、衝突を防止するためのシステムではありません。</strong></p>
        <p id="10315-b67ff6f86725681.92440112"> </p>
        <p id="10315-c67ff6f86725824.47066991"><strong id="d__5443">後退時は、必ず目視やミラーなどで後方および周囲の安全を直接確認して運転してください。</strong></p>
        <p id="10315-e67ff6f86725973.76861830">状況によっては、検知のできない可能性があるため、ブザーや画面の表示のみを頼って後退すると、思わぬ事故につながるおそれがあります。</p>
      </div>
    </div>
  </div>
  <p class="specnote" id="d__10840">✤：タイプやオプションなどにより、装備が異なります。</p>
