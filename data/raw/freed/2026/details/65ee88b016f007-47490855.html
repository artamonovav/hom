  <p id="65ee88b016f007.47490855" class="title">サードシート<span class="OptionSymbol" id="d__1703">✤</span>の調整方法</p>
  <div class="cbox togglebox" id="d__8944">
    <div class="column02 clearfix" id="d__8945">
      <div class="callout callout_2column_v" id="d__8946">
        <div class="cbox_inner" id="d__1704">
          <div class="left-wrap" id="d__1705">
            <div class="callout callout_2column" id="d__8947">
              <div id="d__8948"><img src="../img/33F01081.png" id="d__1707" ya_callout="1" style="" /></div>
              <div class="callout callout_1column" id="d__8949"><ul class="table_set callout" start="1" id="d__1708" style="counter-reset: my-counter 0"><li id="d__1709" class="clearfix"><span id="d__8950"><img class="img_num" src="../img/1.png" ya_callout="1" style="" id="d__8951" /></span><p class="" id="a2c-e660fa201e19980.01517145">ノブ</p>
                  </li>
                </ul>
              </div>
            </div>
          </div>
          <div class="right-wrap" id="d__1711">
            <p id="a2c-12660fa201e20aa7.13426280"><strong id="d__1712">ヘッドレストの調節</strong></p>
            <ol id="d__1713" class="defaultList space-line">
              <li id="d__1714" class="listitem"><span class="" id="a2c-14660fa55af0afa8.24748495">高くするときは、引き上げる</span></li>
              <li id="d__1715" class="listitem"><span id="a2c-15660fa201e27528.53100953">低くするときは、ノブを押しながら下げる</span></li>
              <li id="d__1716" class="listitem"><span id="a2c-17660fa201e2c785.97876650">取り外すときは、ノブを押しながら引き上げる</span></li>
              <li id="d__1717" class="listitem"><span id="a2c-19660fa201e31685.64347511">取り付けるときは、ヘッドレストの脚を元の位置に差し込む</span><ol class="arrow arrows" id="d__1718">
                  <li id="d__1719" class="arrow listitem"><span class="" id="a2c-1c660fa201e36482.51190967">ヘッドレストを軽く上下させ、確実に固定する</span></li>
                </ol>
              </li>
            </ol>
          </div>
        </div>
      </div>
    </div>
    <div class="column02 clearfix" id="d__8952">
      <div class="callout callout_2column_v" id="d__8953">
        <div class="cbox_inner" id="d__1720">
          <div class="left-wrap" id="d__1721">
            <div class="callout callout_2column" id="d__8954">
              <div id="d__8955"><img src="../img/33F01082.png" id="d__1723" ya_callout="1" style="" /></div>
              <div class="callout callout_1column" id="d__8956"><ul class="table_set callout" start="1" id="d__1724" style="counter-reset: my-counter 0"><li id="d__1725" class="clearfix"><span id="d__8957"><img class="img_num" src="../img/1.png" ya_callout="1" style="" id="d__8958" /></span><p class="" id="a2c-26660fb08e648182.35954469">レバー</p>
                  </li>
                </ul>
              </div>
            </div>
          </div>
          <div class="right-wrap" id="d__1727">
            <p id="a2c-28660fb08e64f060.68243288"><strong id="d__1728">背もたれの角度調節</strong></p>
            <p id="a2c-2b661f7db891b767.94269317">レバーを前に倒す</p>
          </div>
        </div>
      </div>
    </div>
    <p id="a2c-2d660fa5ba41ad05.90688875">サードシートのヘッドレストを下げた状態で走行しない。衝突したときに重大な傷害を受けるおそれがあります。</p>
  </div>
  <p class="specnote" id="d__8959">✤：タイプやオプションなどにより、装備が異なります。</p>
