  <p id="6539fcf2eafed0.23980929" class="title">車両データの記録について</p>
  <div class="cbox togglebox" id="d__8096">
    <p id="1226539fcf2f0a6f8.20026235">この車には、車両の操作や制御、車両に搭載された各機能の作動履歴などに関するデータを記録する機能が装備されています。各機能の作動時や操作状況により、主に次のようなデータを記録します（車内の映像や音声は記録しません）。</p>
    <ol id="d__59" class="defaultList space-line">
      <li id="d__60" class="listitem"><span class="" id="9e7-b658cc702906460.39315010">車両の状態（車速など）</span></li>
      <li id="d__61" class="listitem"><span id="9e7-d658cc702906cc6.18919545">運転状態（アクセル、ブレーキ、ステアリング等の操作状況）</span></li>
      <li id="d__62" class="listitem"><span id="9e7-f658cc7029073a2.85524818">SRSエアバッグシステムの作動状況</span></li>
      <li id="d__63" class="listitem"><span id="9e7-12658cc702907a43.71115572">衝突軽減ブレーキ作動時の前方カメラ画像</span></li>
      <li id="d__64" class="listitem"><span id="9e7-17658cc702908083.00835748">車両の故障診断情報</span></li>
    </ol>
  </div>
