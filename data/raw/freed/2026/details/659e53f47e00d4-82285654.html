  <p id="659e53f47e00d4.82285654" class="title">踏み間違い衝突軽減システムのON/OFF</p>
  <div class="cbox togglebox" id="d__10488">
    <p id="765421e6f8767c8.91619973">メーターでシステムのON/OFFを切り換えることができます。</p>
    <p class="refer" id="46540901a165702.67105822"><a href="65e58720ee9a07-82791565.html#6539fcf6d5d198.92894535" id="56540901a166a99.95417654" class="light">表示の切り換えかた</a></p>
    <p class="refer" id="66540901a167c66.98071017"><a href="65e58720ee9a07-82791565.html#6539fcf73e3529.59179699" id="76540901a168b64.21656490" class="light">安全支援情報</a></p>
    <ol id="d__4319" class="defaultList space-line">
      <li id="d__4320" class="listitem"><span class="" id="adb-1b65825813deec79.61562410">機能をOFFにした状態でパワーモードをOFFにした場合でも、再度パワーモードをONにすると自動的にONになります。</span></li>
      <li id="d__4321" class="listitem"><span id="adb-11659e5e74c54ce4.60434333">12Vバッテリー再接続後、踏み間違い衝突軽減システムが一時的にOFFになる場合があります。車速15km/h以上でしばらく走行すると自動でONになります。</span></li>
    </ol>
