  <p id="6539fcf441e6b4.90804744" class="title">イージードアクローザー</p>
  <div class="cbox togglebox" id="d__9368">
    <p id="2856539fcf44453f9.66127664">スライドドアを半ドア状態の位置まで閉めると、自動的に閉まります。</p>
    <p id="2866539fcf4445416.11483414">パワースライドドアのメインスイッチの位置に関係なくイージードアクローザーが作動します。</p>
    <ol id="d__2297" class="defaultList space-line">
      <li id="d__2298" class="listitem"><span class="" id="a4d-e658245e6ae8b41.86579584">イージードアクローザー作動中にスライドドアのハンドルを引くと、作動が止まり半ドア状態のままになります。また、スライドドアのハンドルを引いたままドアを閉めると、イージードアクローザーは作動しません。</span></li>
    </ol>
    <div class="caution" id="d__2299">
      <p class="caution_title" id="d__9369"><img src="../img/caution-sign.png" alt="" width="100%" id="d__9370" />注意</p>
      <div class="caution_txt" id="d__9371">
        <p class="supplement_subhead" id="a4d-156617788dd36e69.87236855"><strong id="d__2300">半ドア状態の位置からドアが自動的に閉まるため、手などをはさまないように注意する。</strong></p>
      </div>
    </div>
    <div class="supplementary" id="d__2301">
      <p class="sup_title" id="d__9372"><img class="sup_title" src="../img/note.png" id="d__9373" /></p>
      <div class="sup_txt" id="d__9374">
        <div class="supplement" id="d__9375"><strong class="supplement_subhead" id="a4d-1c6617788dd380a4.07115827">故障の原因になるので、イージードアクローザーが作動しているときは、無理な力をかけないでください。</strong></div>
      </div>
    </div>
  </div>
