  <p id="6539fcf488d659.31943642" class="title no_accordion">指定燃料とタンク容量</p>
  <p id="6539fcf48a1ab8.95523786" class="sub-title">指定燃料</p>
  <div class="cbox togglebox" id="d__9594">
    <p id="a6e-965824d334c5ac1.12397393">無鉛レギュラーガソリン</p>
    <p id="a6e-9658911a3a20891.07034339">レギュラーバイオ混合ガソリン（E10/ETBE22）</p>
    <div class="supplementary" id="d__2713">
      <p class="sup_title" id="d__9595"><img class="sup_title" src="../img/note.png" id="d__9596" /></p>
      <div class="sup_txt" id="d__9597">
        <div class="supplement" id="d__9598"><strong class="supplement_subhead" id="a6e-e65f295f6dd4188.76038381">指定燃料以外の燃料（粗悪ガソリン、軽油、灯油等）を補給したり、不適切な燃料添加剤を使用しないでください。触媒装置、エンジンや燃料系などの損傷や悪影響を与えるおそれがあります。</strong></div>
        <div class="supplement_para" id="a6e-1065f295f6dd4e00.78572169">プレミアムガソリンも使用できますが、本来のエンジン性能が大きく変わることはありません。</div>
      </div>
    </div>
  </div>
