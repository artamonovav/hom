  <p id="67ff6f86734939.02147024" class="title">画面表示について</p>
  <div class="cbox togglebox" id="d__10850">
    <div class="column02 clearfix" id="d__10851">
      <div class="callout callout_2column_v" id="d__10852">
        <div class="cbox_inner" id="d__5457">
          <div class="left-wrap" id="d__5458">
            <div class="callout callout_2column" id="d__10853"><img src="../img/33H02018_2.png" id="d__5460" ya_callout="1" style="" /></div>
          </div>
          <div class="right-wrap" id="d__5461">
            <p id="10315-a67ff6f86742ef1.78523107">接近してくる車両を検知している間は、接近方向矢印（<img class="img_num" src="../img/1.png" id="d__10854" />）が表示されます。</p>
          </div>
        </div>
      </div>
    </div>
    <p id="10315-c67ff6f867430b3.79251472">画面右下のアイコンが<img src="../img/inline/it_074.png" id="d__5463" class=" icon_inline" style="height: 24px; vertical-align: middle;" />から<img src="../img/inline/it_075.png" id="d__5464" class=" icon_inline" style="height: 24px; vertical-align: middle;" />（オレンジ）に変わったときは、リヤバンパー側面に雪や泥などが付着していることにより一時的にシステムが動作しません。リヤバンパー側面の付着物を取り除いてください。</p>
    <p id="10315-f67ff6f86743225.47891922"><img src="../img/inline/it_076.png" id="d__5465" class=" icon_inline" style="height: 24px; vertical-align: middle;" />アイコンに変わったときは、システムに異常がありますので、システムを使用せずHonda販売店で点検を受けてください。</p>
    <ol id="d__5466" class="defaultList space-line">
      <li id="d__5467" class="listitem"><span class="" id="10315-1167ff6f86743377.70549246">シフトポジションを<span class="frame" id="d__5468">R</span>にしても画面が切り換わらないときは、Honda販売店で点検を受けてください。</span></li>
    </ol>
  </div>
  <p class="specnote" id="d__10855">✤：タイプやオプションなどにより、装備が異なります。</p>
