  <p id="65f17f9a989bb1.79827660" class="title">エアバッグのお手入れ</p>
  <div class="cbox togglebox" id="d__8454">
    <p id="9f1-565f17f9a9b1725.45123449">エアバッグシステムは、メンテナンスを必要とせず、部品交換の必要もありません。ただし、以下の場合はHonda販売店で点検を受けてください。</p>
  </div>
  <p id="9f1-865f17f9a9bc150.43017728" class="sub-title">エアバッグが作動し、膨らんだとき</p>
  <div class="cbox togglebox" id="d__8455">
    <p id="9f1-1065f183a3462912.17208184">一度作動したエアバッグは、コントロールユニットやその他の関連部品とともに必ず交換する必要があります。</p>
    <p id="9f1-1265f183a3472233.08635657">また、シートベルトプリテンショナーも同様に、一度作動した場合は新品と交換する必要があります。</p>
    <div class="supplementary" id="d__976">
      <p class="sup_title" id="d__8456"><img class="sup_title" src="../img/note.png" id="d__8457" /></p>
      <div class="sup_txt" id="d__8458">
        <div class="supplement" id="d__8459"><strong class="supplement_subhead" id="9f1-1765f280b94ce207.57539591">エアバッグ関連部品の再利用はしないでください。</strong></div>
      </div>
    </div>
  </div>
