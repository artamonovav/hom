  <p id="67ff6f86725c98.59778792" class="title">システムの作動</p>
  <div class="cbox togglebox" id="d__10841">
    <div class="column02 clearfix" id="d__10842">
      <div class="callout callout_2column_v" id="d__10843">
        <div class="cbox_inner" id="d__5446">
          <div class="left-wrap" id="d__5447">
            <div class="callout callout_2column" id="d__10844">
              <div id="d__10845"><img src="../img/33H02017.png" id="d__5449" ya_callout="1" style="" /></div>
              <div class="callout callout_1column" id="d__10846"><ul class="table_set callout" start="1" id="d__5450" style="counter-reset: my-counter 0"><li id="d__5451" class="clearfix"><span id="d__10847"><img class="img_num" src="../img/1.png" ya_callout="1" style="" id="d__10848" /></span><p class="" id="10315-967ff6f86734170.65864116">検知範囲</p>
                  </li>
                </ul>
              </div>
            </div>
          </div>
          <div class="right-wrap" id="d__5453">
            <p id="10315-b67ff6f86734330.23403182">シフトポジションが<span class="frame" id="d__5454">R</span>でシステムがONのとき、自車の車速が約5km/h以下の場合に車両後方の左右から接近する他の車両を検知し、ブザーと表示でお知らせします。</p>
            <p id="10315-d67ff6f86734492.71746785">自車の真後ろから接近する他の車両は検知しません。また、検知している他の車両が自車の真後ろまで到達した時点でお知らせを停止します。</p>
            <p id="10315-e67ff6f86734608.80053732">また接近する歩行者、自転車、二輪車を検知する場合があります。</p>
          </div>
        </div>
      </div>
    </div>
  </div>
  <p class="specnote" id="d__10849">✤：タイプやオプションなどにより、装備が異なります。</p>
