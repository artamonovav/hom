  <p id="6539fcf56ffa50.03740497" class="title">カーゴフック<span class="OptionSymbol" id="d__3603">✤</span></p>
  <div class="cbox togglebox" id="d__10115">
    <div class="column02 clearfix" id="d__10116">
      <div class="callout callout_2column_v" id="d__10117">
        <div class="cbox_inner" id="d__3604">
          <div class="left-wrap" id="d__3605">
            <div class="callout callout_2column" id="d__10118">
              <div id="d__10119"><img src="../img/33F03014.png" id="d__3607" ya_callout="1" style="" /></div>
              <div class="callout callout_1column" id="d__10120"><ul class="table_set callout" start="1" id="d__3608" style="counter-reset: my-counter 0"><li id="d__3609" class="clearfix"><span id="d__10121"><img class="img_num" src="../img/1.png" ya_callout="1" style="" id="d__10122" /></span><p class="" id="ab8-e65aa3d5d5ac7f6.47744472">フック<span class="OptionSymbol" id="d__3611">✤</span></p>
                  </li>
                  <li id="d__3612" class="clearfix"><span id="d__10123"><img class="img_num" src="../img/2.png" ya_callout="1" style="" id="d__10124" /></span><p class="" id="ab8-1165aa3d5d5ad902.57009843">フック</p>
                  </li>
                </ul>
              </div>
            </div>
          </div>
          <div class="right-wrap" id="d__3614">
            <p id="10653f73925fa657.93430604">カーゴフックは市販のカーゴネットを使用して、収納したものを固定しておくときに便利です。</p>
          </div>
        </div>
      </div>
    </div>
    <div class="caution" id="d__3615">
      <p class="caution_title" id="d__10125"><img src="../img/caution-sign.png" alt="" width="100%" id="d__10126" />注意</p>
      <div class="caution_txt" id="d__10127">
        <p class="supplement_subhead" id="ab8-1c660fca01414065.74356659"><strong id="d__3616">走行中は荷物の出し入れをしない。</strong></p>
        <p class="supplement_para" id="ab8-1e660fca01415883.35789503">急ブレーキなどのときに思わぬ事故につながるおそれがあります。</p>
      </div>
    </div>
    <ol id="d__3617" class="defaultList space-line">
      <li id="d__3618" class="listitem"><span class="" id="ab8-1b6582c4d85581b0.19717345">重い荷物はできるだけ前に積んでください。荷物を積むとき、荷重が1か所に集中しないように配置してください。</span></li>
    </ol>
  </div>
  <p class="specnote" id="d__10128">✤：タイプやオプションなどにより、装備が異なります。</p>
