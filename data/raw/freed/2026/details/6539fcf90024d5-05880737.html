  <p id="6539fcf90024d5.05880737" class="title">緊急時のエンジンの停止方法</p>
  <div class="cbox togglebox" id="d__11832">
    <p confirmed="1" id="6657ab78a325b80.53831556">走行中、緊急事態の場合にエンジンを停止することができます。エンジンを停止しなければならない場合は、以下のいずれかを行ってください。</p>
    <ol id="d__7388" class="defaultList space-line">
      <li id="d__7389" class="listitem"><span class="" id="b9d-1065895934dd9490.35799126"><span class="frame" id="d__7390">ENGINE START/STOP</span>を約2秒以上押す</span></li>
      <li id="d__7391" class="listitem"><span id="b9d-1965895934dd9be0.20875005"><span class="frame" id="d__7392">ENGINE START/STOP</span>を連続して3回押す</span></li>
      <li id="d__7393" class="listitem"><span id="b9d-2665895934dda3c3.33672405">この操作を行った場合は、ハンドルはロックせず、パワーモードはアクセサリーモードになります。</span></li>
    </ol>
    <div class="supplementary" id="d__7394">
      <p class="sup_title" id="d__11833"><img class="sup_title" src="../img/note.png" id="d__11834" /></p>
      <div class="sup_txt" id="d__11835">
        <div class="supplement" id="d__11836"><strong class="supplement_subhead" id="b9d-2b65dea3c1e25307.24548777">緊急時など必要な場合以外は、走行中にエンジンを停止しないでください。</strong></div>
      </div>
    </div>
  </div>
