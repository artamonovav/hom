  <p id="6539fcf4c337f3.76908421" class="title">エマージェンシーストップシグナル</p>
  <div class="cbox togglebox" id="d__9743">
    <p id="2796539fcf4c764a7.09420267">60km/h以上で走行時に急ブレーキをかけると、非常点滅表示灯が高速で点滅し、後続車に急ブレーキを知らせるシステムです。</p>
    <p id="2826539fcf4c764c9.92754997">以下の状態になると、エマージェンシーストップシグナルが停止します。</p>
    <ol id="d__2964" class="defaultList space-line">
      <li id="d__2965" class="listitem"><span class="" id="a79-1065891f836f6bb3.58668350">ブレーキペダルを離したとき</span></li>
      <li id="d__2966" class="listitem"><span id="a79-1265891f836f7c46.57817877">ABSが停止したとき</span></li>
      <li id="d__2967" class="listitem"><span id="a79-1465891f836f8cf9.06121806">急減速でなくなったとき</span></li>
      <li id="d__2968" class="listitem"><span id="a79-1665891f836f9c30.62644577">ハザードスイッチをONにしたとき</span></li>
    </ol>
    <div class="supplementary" id="d__2969">
      <p class="sup_title" id="d__9744"><img class="sup_title" src="../img/note.png" id="d__9745" /></p>
      <div class="sup_txt" id="d__9746">
        <div class="supplement" id="d__9747"><strong class="supplement_subhead" id="a79-1e6614af4fbafc92.98983793">エマージェンシーストップシグナルは、追突されるおそれを低減するシステムであり、追突を完全に防ぐものではありません。</strong></div>
        <div class="supplement_para" id="a79-206614af4fbb40b0.46265842">運転するときは不必要な急ブレーキを避け、安全運転を心がけてください。</div>
      </div>
    </div>
