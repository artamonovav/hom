  <p id="6539fcf8f1d8b7.13346914" class="title">スマートキーの電池が切れたときの始動方法</p>
  <div class="cbox togglebox" id="d__11828">
    <p id="796539fcf9059761.37422934"><span class="frame" id="d__7371">ENGINE START/STOP</span>によるパワーモードの操作やエンジンの始動ができない場合、以下の手順を行ってください。</p>
    <div class="column02 clearfix" id="d__11829">
      <div class="callout callout_2column_v" id="d__11830">
        <div class="cbox_inner" id="d__7372">
          <div class="left-wrap" id="d__7373">
            <div class="callout callout_2column" id="d__11831"><img src="../img/33F07022.png" id="d__7375" ya_callout="1" style="" /></div>
          </div>
          <div class="right-wrap" id="d__7376">
            <ol class="procedure" start="1" id="d__7377">
              <li id="d__7378" class="step arrows"><span class="" id="b9d-1c65895934dcd4a6.28937414"><span class="frame" id="d__7379">ENGINE START/STOP</span>を押す。</span></li>
              <li id="d__7380" class="step arrows"><span class="" id="b9d-2265895934dcde96.61818105">30秒以内に、スマートキーのキーレスボタンを手前に向けて<span class="frame" id="d__7381">ENGINE START/STOP</span>に接触させる。</span></li>
              <li id="d__7382" class="step arrows"><span class="" id="b9d-2d65895934dce628.88399528">10秒以内に、ブレーキペダルを踏みながら<span class="frame" id="d__7383">ENGINE START/STOP</span>を押す。</span><ol class="arrow arrows" id="d__7384">
                  <li id="d__7385" class="arrow listitem"><span class="" id="b9d-3565895934dcef44.58340842">ペダルを踏んでいないときは、アクセサリーモードになります。</span></li>
                </ol>
              </li>
            </ol>
          </div>
        </div>
      </div>
    </div>
