  <p id="6539fcf7c98625.74474874" class="title">ウィンドウォッシャー液の補給方法</p>
  <div class="cbox togglebox" id="d__11314">
    <div class="column02 clearfix" id="d__11315">
      <div class="callout callout_2column_v" id="d__11316">
        <div class="cbox_inner" id="d__6445">
          <div class="left-wrap" id="d__6446">
            <div class="callout callout_2column" id="d__11317"><img src="../img/33F06005.png" id="d__6448" ya_callout="1" style="" /></div>
          </div>
          <div class="right-wrap" id="d__6449">
            <p id="b76-b6582bbf13c4d63.73908559">ウォッシャー液が減っていた場合は、ウォッシャー液を補給してください。</p>
            <p id="b76-e65d80da6e91f33.53150160">ウォッシャー液の量は、ウォッシャー液レベルゲージで確認します。</p>
          </div>
        </div>
      </div>
    </div>
    <ol id="d__6450" class="defaultList space-line">
      <li id="d__6451" class="listitem"><span class="" id="b76-166582ba929878f8.80915230">ウォッシャー液以外の液体を、タンクに入れないでください。</span></li>
      <li id="d__6452" class="listitem"><span id="b76-196582ba92987ee5.73664233">ウォッシャー液は必要に応じて水（軟水）で薄めてください。</span></li>
      <li id="d__6453" class="listitem"><span id="b76-1b6582ba92988404.84975384">冬期はウォッシャー液の凍結を防ぐため、ウォッシャー液の濃度を上げてください。</span></li>
    </ol>
  </div>
