  <p id="65825426301b39.25214790" class="title">電球の交換方法</p>
  <div class="cbox togglebox" id="d__11590">
    <div class="L5" id="d__6891">
      <p id="6539fcf8b42954.19046219" class="lower-title no_accordion">室内灯/カーゴスペース照明灯<span class="OptionSymbol" id="d__6892">✤</span>/テールゲート照明灯<span class="OptionSymbol" id="d__6893">✤</span></p>
    </div>
    <div class="L5" komidashi="komidashi" id="d__6894">
      <p id="1196539fcf8bd48a5.69322142">交換する場合は、<strong id="d__6895">「12Vー8W」</strong>の電球をご使用ください。</p>
      <div class="column02 clearfix" id="d__11591">
        <div class="callout callout_2column_v" id="d__11592">
          <div class="cbox_inner" id="d__6896">
            <div class="left-wrap" id="d__6897">
              <div class="callout callout_2column" id="d__11593"><img src="../img/33F06006.png" id="d__6899" ya_callout="1" style="" /></div>
            </div>
            <div class="right-wrap" id="d__6900">
              <ol class="procedure" start="1" id="d__6901">
                <li id="d__6902" class="step arrows"><span class="" id="b90-61658251c1216b91.31904626">ランプ本体にマイナスドライバーの先端を差し込み、押し開ける。</span></li>
              </ol>
            </div>
          </div>
        </div>
      </div>
      <div class="column02 clearfix" id="d__11594">
        <div class="callout callout_2column_v" id="d__11595">
          <div class="cbox_inner" id="d__6903">
            <div class="left-wrap" id="d__6904">
              <div class="callout callout_2column" id="d__11596"><img src="../img/33F06007.png" id="d__6906" ya_callout="1" style="" /></div>
            </div>
            <div class="right-wrap" id="d__6907">
              <ol class="procedure" start="2" id="d__6908">
                <li id="d__6909" class="step arrows"><span class="" id="b90-6c658251c12171f2.76849297" start="2">古い電球（<img class="img_num" src="../img/1.png" id="d__11597" />）を抜き取り、新しい電球を差し込む。</span></li>
              </ol>
            </div>
          </div>
        </div>
      </div>
      <ol id="d__6911" class="defaultList space-line">
        <li id="d__6912" class="listitem"><span class="" id="b90-72658251c1217794.90719707">ランプが傷付かないよう、ドライバーに布などを巻き付けてください。</span></li>
      </ol>
    </div>
  </div>
  <p class="specnote" id="d__11598">✤：タイプやオプションなどにより、装備が異なります。</p>
