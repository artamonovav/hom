  <p id="6539fcf5738b85.74845783" class="title">スライドドアウィンドウサンシェード</p>
  <div class="cbox togglebox" id="d__10228">
    <div class="column02 clearfix" id="d__10229">
      <div class="callout callout_2column_v" id="d__10230">
        <div class="cbox_inner" id="d__3746">
          <div class="left-wrap" id="d__3747">
            <div class="callout callout_2column" id="d__10231">
              <div id="d__10232"><img src="../img/33F03015.png" id="d__3749" ya_callout="1" style="" /></div>
              <div class="callout callout_1column" id="d__10233"><ul class="table_set callout" start="1" id="d__3750" style="counter-reset: my-counter 0"><li id="d__3751" class="clearfix"><span id="d__10234"><img class="img_num" src="../img/1.png" ya_callout="1" style="" id="d__10235" /></span><p class="" id="ab8-d65aa3d5d5bccc2.35390097">ノブ</p>
                  </li>
                  <li id="d__3753" class="clearfix"><span id="d__10236"><img class="img_num" src="../img/2.png" ya_callout="1" style="" id="d__10237" /></span><p class="" id="ab8-f65aa3d5d5bdaa3.62641427">フック</p>
                  </li>
                </ul>
              </div>
            </div>
          </div>
          <div class="right-wrap" id="d__3755">
            <p id="2666539fcf57ae5b7.13262058">使用するときはノブを持って引き上げます。</p>
            <p id="2676539fcf57ae5c6.03434283">サンシェードをフックにかけます。</p>
          </div>
        </div>
      </div>
    </div>
    <p id="ab8-20661cede01738e8.44630358">以下の場合、サンシェードが破損するおそれがあります。</p>
    <ol id="d__3756" class="defaultList space-line">
      <li id="d__3757" class="listitem"><span class="" id="ab8-23661cede01770d1.28401997">斜めに収納したり、勢いよく収納する</span></li>
      <li id="d__3758" class="listitem"><span id="ab8-25661cede017a562.57715146">フックにかけたままスクリーン部分をめくる</span></li>
    </ol>
    <div class="caution" id="d__3759">
      <p class="caution_title" id="d__10238"><img src="../img/caution-sign.png" alt="" width="100%" id="d__10239" />注意</p>
      <div class="caution_txt" id="d__10240">
        <p class="supplement_subhead" id="ab8-22660fca01457557.22385810"><strong id="d__3760">フックにはサンシェード以外のものをかけたりしない。</strong></p>
        <p class="supplement_para" id="ab8-24660fca01458d60.70005218">サイドカーテンエアバッグが正常に作動しなかったり、作動時にものが飛んだりしてけがをするおそれがあります。また、走行中は窓を閉めてください。風にあおられてサンシェードがフックから外れるおそれがあります。</p>
      </div>
    </div>
