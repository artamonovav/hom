  <div class="cbox togglebox" id="d__8074">
    <p id="156539fcf2f0a049.46090246"><strong id="d__8">「運転者や他の人が傷害を受ける可能性のあること」を回避方法と共に、下記の表示で記載しています。これらは重要ですので、しっかりお読みください。</strong></p>
    <div class="danger" id="d__9">
      <p class="danger_title" id="d__8075"><img src="../img/danger-sign.png" alt="" width="100%" id="d__8076" />危険</p>
      <div class="danger_txt" id="d__8077">
        <p id="1065548b888ecdc8.05388562">指示にしたがわないと、死亡または重大な傷害に至るもの</p>
      </div>
    </div>
    <div class="warning" id="d__10">
      <p class="warning_title" id="d__8078"><img src="../img/warning-sign.png" alt="" width="100%" id="d__8079" />警告</p>

      </div>
    </div>
    <div class="caution" id="d__11">
      <p class="caution_title" id="d__8081"><img src="../img/caution-sign.png" alt="" width="100%" id="d__8082" />注意</p>
