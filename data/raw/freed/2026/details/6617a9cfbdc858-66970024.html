  <p id="6617a9cfbdc858.66970024" class="title">フロアボード<span class="OptionSymbol" id="d__3762">✤</span></p>
  <div class="cbox togglebox" id="d__10241">
    <div class="column02 clearfix" id="d__10242">
      <div class="callout callout_2column_v" id="d__10243">
        <div class="cbox_inner" id="d__3763">
          <div class="left-wrap" id="d__3764">
            <div class="callout callout_2column" id="d__10244">
              <div id="d__10245"><img src="../img/33F03016.png" id="d__3766" ya_callout="1" style="" /></div>
              <div class="callout callout_1column" id="d__10246"><ul class="table_set callout" start="1" id="d__3767" style="counter-reset: my-counter 0"><li id="d__3768" class="clearfix"><span id="d__10247"><img class="img_num" src="../img/1.png" ya_callout="1" style="" id="d__10248" /></span><p class="" id="ab8-d65aa3e47ecf376.76546088">フロアボード</p>
                  </li>
                </ul>
              </div>
            </div>
          </div>
          <div class="right-wrap" id="d__3770">
            <p confirmed="1" id="1365700f3a396059.99959612">フロアボードを外してカーゴスペースを広くできます。</p>
            <p confirmed="1" id="ab8-1165f18de0f125b7.98316340">外したフロアボードを車内に置く場合は、カーゴスペースの床面に置いてください。</p>
            <p confirmed="1" id="ab8-1265f18de0f13525.31464970">フロアボードは表面、裏面どちらでも使用できます。</p>
          </div>
        </div>
      </div>
    </div>
    <div class="caution" id="d__3771">
      <p class="caution_title" id="d__10249"><img src="../img/caution-sign.png" alt="" width="100%" id="d__10250" />注意</p>
      <div class="caution_txt" id="d__10251">
        <p class="supplement_subhead" id="ab8-16660fca01465dc5.13890013"><strong id="d__3772">走行中は荷物の出し入れはしない。</strong></p>
        <p class="supplement_para" id="ab8-18660fca01467449.65597930">急ブレーキなどのときに思わぬ事故につながるおそれがあります。</p>
        <p class="supplement_subhead" id="ab8-19660fca01468b43.69144287"><strong id="d__3773">フロアボードの上、およびカーゴスペースには人を乗せて走行しない。</strong></p>
        <p class="supplement_para" id="ab8-1a660fca0146a168.08268902">ブレーキや加速、衝突のときなどにけがをするおそれがあります。</p>
        <p class="supplement_subhead" id="ab8-1b660fca0146b821.76629719"><strong id="d__3774">操作するときは、手や足などをはさまないように十分注意する。</strong></p>
      </div>
    </div>
  </div>
  <p class="specnote" id="d__10252">✤：タイプやオプションなどにより、装備が異なります。</p>
