  <p id="65defec8ca1e51.92630914" class="title">パーキングセンサーのON/OFF</p>
  <div class="cbox togglebox" id="d__10887">
    <p id="1a09-565defec8cb7ab7.09083695">メーターでシステムのON/OFFを切り換えることができます。</p>
    <ol id="d__5511" class="defaultList space-line">
      <li id="d__5512" class="listitem"><span class="" id="1a09-865defec8cb7d45.29241780">エンジン始動時は、パワーモードをOFFする前の状態（ONまたはOFF）を保持します。</span><p class="refer" id="1a09-136619296ac29a27.18735451"><a href="65e58720ee9a07-82791565.html#6539fcf6d5d198.92894535" id="1a09-16661928b2eaae09.63677283" class="light">表示の切り換えかた</a></p>
        <p class="refer" id="1a09-156619296ac2c4f4.25762951"><a href="65e58720ee9a07-82791565.html#6539fcf73e3529.59179699" id="1a09-1a661928b2eacb72.16542960" class="light">安全支援情報</a></p>
      </li>
    </ol>
    <p id="1a09-1766191079626493.91530924"> </p>
    <p id="1a09-465deff5b181e11.40402616">リアパーキングセンサーだけをOFFにすることもできます。リアパーキングセンサーをOFFにすると、後退中の踏み間違い衝突軽減システムは作動しません。</p>
    <p class="refer" id="1a09-b65defec8cb7fd7.17559788"><a href="65e58720ee9a07-82791565.html#6539fcf75b3550.64943900" id="1a09-c65defec8cb8106.17604324" class="light">時計<span class="OptionSymbol" id="d__5513">✤</span>/車両設定</a></p>
    <p class="refer" id="1a09-565deff5b1820a4.69807836"><a href="6539fcf5b71835-83139306.html#6539fcf5b71835.83139306" id="1a09-9665deff28095b07.78465476" class="light">踏み間違い衝突軽減システムについて</a></p>
