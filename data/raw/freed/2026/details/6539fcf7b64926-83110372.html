  <p id="6539fcf7b64926.83110372" class="title">メンテナンス時の備品や場所に関する注意事項</p>
  <div class="cbox togglebox" id="d__11246">
    <ol id="d__6312" class="defaultList space-line">
      <li id="d__6313" class="listitem"><span class="" id="b72-9658a1045ddba28.31056053">タバコの火、火花、炎を引火性の液体やガスから遠ざけているか</span></li>
      <li id="d__6314" class="listitem"><span id="b72-f658a1045ddc0f8.01593999">タオルや可燃物をボンネット内に置き忘れていないか</span><ol class="arrow arrows" id="d__6315">
          <li id="d__6316" class="arrow listitem"><span class="" id="b72-13658a1045ddc6f7.93037432">火災や爆発などの思わぬ事故につながるおそれがあります。</span></li>
        </ol>
      </li>
      <li id="d__6317" class="listitem"><span id="b72-18658a1045ddcc58.42087276">エンジンを始動するときに十分な換気を行っているか</span><ol class="arrow arrows" id="d__6318">
          <li id="d__6319" class="arrow listitem"><span class="" id="b72-1c658a1045ddd0c8.65046210">換気が十分でないと、排気ガスに含まれる一酸化炭素の毒作用で意識不明になったり、死亡するおそれがあります。</span></li>
        </ol>
      </li>
    </ol>
