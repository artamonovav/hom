  <p id="6539fcf380fe02.25648758" class="title">キーレスエントリーシステムを使った施錠/解錠方法</p>
  <div class="cbox togglebox" id="d__8525">
    <p id="6539fcf381d878.24271608" class="lower-title no_accordion">施錠</p>
    <div class="column02 clearfix" id="d__8526">
      <div class="callout callout_2column_v" id="d__8527">
        <div class="cbox_inner" id="d__1080">
          <div class="left-wrap" id="d__1081">
            <div class="callout callout_2column" id="d__8528"><img src="../img/33F01023.png" id="d__1083" ya_callout="1" style="" /></div>
          </div>
          <div class="right-wrap" id="d__1084">
            <p id="a1f-10660a24dddf3a02.96635563">施錠ボタン（<img class="img_num" src="../img/1.png" id="d__8529" />）を押す。</p>
            <p id="a1f-11660a24dddf6b30.22882926">1 回目：</p>
            <ol class="arrow arrows" id="d__1086">
              <li id="d__1087" class="arrow listitem"><span class="" id="a1f-14660a24dddf9988.73070959">非常点滅表示灯が1回点滅し、すべてのドアやテールゲートが施錠されます。</span></li>
            </ol>
            <p id="a1f-16660a24dddfb723.35916907">2 回目（施錠ボタンを押して5 秒以内）：</p>
            <ol class="arrow arrows" id="d__1088">
              <li id="d__1089" class="arrow listitem"><span class="" id="a1f-19660a24dddfd474.26175476">アンサーバックブザーが鳴りドア、テールゲートが施錠されたか確認できます。  </span></li>
            </ol>
          </div>
        </div>
      </div>
    </div>
    <p id="6539fcf3838c73.77188080" class="lower-title no_accordion">解錠</p>
    <div class="column02 clearfix" id="d__8530">
      <div class="callout callout_2column_v" id="d__8531">
        <div class="cbox_inner" id="d__1092">
          <div class="left-wrap" id="d__1093">
            <div class="callout callout_2column" id="d__8532"><img src="../img/33F01024.png" id="d__1095" ya_callout="1" style="" /></div>
          </div>
          <div class="right-wrap" id="d__1096">
            <p id="386539fcf3a8f174.75659036">解錠ボタン（<img class="img_num" src="../img/1.png" id="d__8533" />）を押す。</p>
            <ol class="arrow arrows" id="d__1098">
              <li id="d__1099" class="arrow listitem"><span class="" id="a1f-2c6582b952decd39.62216536">非常点滅表示灯が2回点滅し、すべてのドア、テールゲートが解錠されます。</span></li>
            </ol>
          </div>
        </div>
      </div>
    </div>
    <p id="a1f-2d660b6f2d139692.66781785">キーレスエントリーシステムで解錠操作をした場合、30 秒以内にドア、テールゲートを開けないと、再び自動的に施錠されます。</p>
