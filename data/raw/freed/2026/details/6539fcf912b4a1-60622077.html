  <p id="6539fcf912b4a1.60622077" class="title">ロックを解除する</p>
  <div class="cbox togglebox" id="d__11869">
    <p id="156539fcf914db26.09949198">シフトレバーが、<span class="frame" id="d__7464">P</span>の位置でロックされて動かなくなったら、下記の方法で解除してください。</p>
    <div class="column02 clearfix" id="d__11870">
      <div class="callout callout_2column_v" id="d__11871">
        <div class="cbox_inner" id="d__7465">
          <div class="left-wrap" id="d__7466">
            <div class="callout callout_2column" id="d__11872"><img src="../img/33F07025.png" id="d__7468" ya_callout="1" style="" /></div>
          </div>
          <div class="right-wrap" id="d__7469">
            <ol class="procedure" start="1" id="d__7470">
              <li id="d__7471" class="step arrows"><span class="" id="ba5-1365a4ca7c469a41.95076016">パーキングブレーキをかける。</span></li>
              <li id="d__7472" class="step arrows"><span class="" id="ba5-1665a4ca7c469f84.76758800">パワーモードをOFFモードにする。</span></li>
              <li id="d__7473" class="step arrows"><span class="" id="ba5-1965a4ca7c46a214.78566958">シフトロック解除穴に内蔵キー（<img class="img_num" src="../img/1.png" id="d__11873" />）を差し込む。</span></li>
              <li id="d__7475" class="step arrows"><span class="" id="ba5-2065a4ca7c46a440.54307490">キーを押しながらシフトレバーのボタン（<img class="img_num" src="../img/2.png" id="d__11874" />）を押し、シフトレバーを<span class="frame" id="d__7477">N</span>に入れる。</span><ol class="arrow arrows" id="d__7478">
                  <li id="d__7479" class="arrow listitem"><span class="" id="ba5-2565a4ca7c46a601.18347027">ロックが解除されました。Honda販売店で、早めに点検を受けてください。</span></li>
                </ol>
              </li>
            </ol>
          </div>
        </div>
      </div>
    </div>
