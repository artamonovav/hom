  <p id="659e77cc94ed48.09786645" class="title">歩行者事故低減ステアリングのON/OFF</p>
  <div class="cbox togglebox" id="d__10559">
    <p id="ae2-7659e77cc958652.27886705">歩行者事故低減ステアリングは、路外逸脱抑制機能をONにすると作動します。メーターで路外逸脱抑制機能のON/OFFを切り替えてください。</p>
    <p class="refer" id="ae2-a66192643d6c243.96564227"><a href="65e58720ee9a07-82791565.html#6539fcf6d5d198.92894535" id="ae2-9659e77cc9595a5.91109735" class="light">表示の切り換えかた</a></p>
    <p class="refer" id="ae2-e66192643d6d144.79044341"><a href="65e58720ee9a07-82791565.html#6539fcf73e3529.59179699" id="ae2-b659e77cc95a267.22603487" class="light">安全支援情報</a></p>
    <ol id="d__4555" class="defaultList space-line">
      <li id="d__4556" class="listitem"><span class="" id="ae2-84658259a5c07ba5.37220895">エンジンを始動したときは、パワーモードをOFFする前の状態（ONまたはOFF）を保持します。</span></li>
    </ol>
  </div>
