  <p id="6539fcf401a0f9.14404183" class="title">シートベルトリマインダー</p>
  <div class="cbox togglebox" id="d__9126">
    <div class="column02 clearfix" id="d__9127">
      <div class="callout callout_2column_v" id="d__9128">
        <div class="cbox_inner" id="d__1948">
          <div class="left-wrap" id="d__1949">
            <div class="callout callout_2column" id="d__9129">
              <div id="d__9130"><img src="../img/33F01002.png" id="d__1951" ya_callout="1" style="" /></div>
              <div class="callout callout_1column" id="d__9131"><ul class="table_set callout" start="1" id="d__1952" style="counter-reset: my-counter 0"><li id="d__1953" class="clearfix"><span id="d__9132"><img class="img_num" src="../img/1.png" ya_callout="1" style="" id="d__9133" /></span><p class="" id="a37-d6583a10e8ede94.19425260">シートベルト着用</p>
                  </li>
                  <li id="d__1955" class="clearfix"><span id="d__9134"><img class="img_num" src="../img/2.png" ya_callout="1" style="" id="d__9135" /></span><p class="" id="a37-f6583a10e8efae5.99330419">シートベルト未着用</p>
                  </li>
                </ul>
              </div>
            </div>
          </div>
          <div class="right-wrap" id="d__1957">
            <p id="2396539fcf4073433.71456958">シートベルトリマインダーは乗員のシートベルトの未着用をお知らせします。シートベルトを着用すると警告は消えます。</p>
          </div>
        </div>
      </div>
    </div>
    <p id="2436539fcf4073472.98774997">シートベルトを着用せずに走行した場合、停車したときや一定時間経過したときは、ブザーが停止します。</p>
    <ol class="arrow arrows" id="d__1958">
      <li id="d__1959" class="arrow listitem"><span class="" id="a37-1e65823fc0956e98.01887037">助手席に人がいないときでも、荷物を置くと反応することがあります。</span></li>
      <li id="d__1960" class="arrow listitem"><span id="a37-2165823fc0957ca4.89857258">助手席にお子さまや小柄な方を乗せたり、クッションを使用しているときは、反応しないことがあります。</span></li>
    </ol>
  </div>
