        <div class="inner"><section><p>HondaおよびHondaが委託した第三者は、取得したデータを以下の場合を除き、第三者へ開示、提供することはありません。</p>
            <ul class="info_list">
              <li><span id="_136_970_90.1178">お車の所有者または使用者の同意がある場合</span></li>
              <li><span id="_136_970_90.1180">裁判所命令等、法的強制力のある要請に基づく場合</span></li>
              <li><span id="_136_970_90.1182">統計的な処理を行う等、使用者や車が特定できないように加工したデータを、研究機関等に提供する場合</span></li>
